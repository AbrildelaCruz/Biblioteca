<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida - Biblioteca Sullivan</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logobiblioteca.png">
</head>
<body>

    <!-- Contenedor Maestro -->
    <div id="pantalla-biblioteca">
        
        <!-- El Portal Virtual de Acceso (Hojas Izquierda y Derecha) -->
        <div class="portal-geometrico">
            <div class="hoja puerta-izquierda"></div>
            <div class="hoja puerta-derecha"></div>
        </div>

        <!-- Interfaz con el botón dorado institucional -->
        <div class="interfaz-bienvenida" id="bloque-entrada">
            <button id="btn-entrar" onclick="activarEfectoPortal()">Ingresar al Sistema</button>
        </div>

    </div>

    <script>
    function activarEfectoPortal() {
        const bloqueEntrada = document.getElementById('bloque-entrada');
        const pIzquierda = document.querySelector('.puerta-izquierda');
        const pDerecha = document.querySelector('.puerta-derecha');
        const contenedor = document.getElementById('pantalla-biblioteca');
        
        // 1. El botón se vuelve un destello y desaparece
        bloqueEntrada.classList.add('efecto-destello');
        
        // 2. Activamos el efecto de hiperespacio y apertura cinemática
        setTimeout(() => {
            pIzquierda.classList.add('portal-abrir-izq');
            pDerecha.classList.add('portal-abrir-der');
            contenedor.classList.add('hiperespacio');
        }, 150);
        
        // 3. Redirección limpia hacia tu archivo de registro PHP
        setTimeout(() => {
            window.location.href = 'registro.php';
        }, 1400);
    }
    </script>
</body>
</html>
