<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida - Biblioteca Sullivan</title>
    <!-- Vinculación limpia a tu hoja de estilos externa -->
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logobiblioteca.png">
</head>
<body>

    <!-- Contenedor maestro de la animación -->
    <div id="pantalla-biblioteca" class="fondo-cerrado">
        
        <!-- Interfaz flotante con tu botón dorado institucional -->
        <div class="interfaz-bienvenida" id="bloque-entrada">
            <button id="btn-entrar" onclick="iniciarAnimacionPuertas()">Ingresar al Sistema</button>
        </div>

    </div>

    <!-- Zona de precarga técnica oculta para evitar parpadeos en el navegador -->
    <div class="precarga">
        <img src="puertas-cerradas.JPG" alt="Precarga 1">
        <img src="puertas-semiabiertas.JPG" alt="Precarga 2">
        <img src="puertas-abiertas.JPG" alt="Precarga 3">
    </div>

    <!-- Motor lógico en JavaScript Nativo -->
    <script>
    function iniciarAnimacionPuertas() {
        const pantalla = document.getElementById('pantalla-biblioteca');
        const bloqueEntrada = document.getElementById('bloque-entrada');

        // Ocultar la interfaz flotante usando la clase del CSS
        bloqueEntrada.classList.add('ocultar');

        // Orquesta el cambio de clases del CSS en milisegundos reales
        setTimeout(() => {
            pantalla.className = 'fondo-semiabierto';
        }, 300);

        setTimeout(() => {
            pantalla.className = 'fondo-abierto';
        }, 800);

        // Redirección segura a tu panel unificado
        setTimeout(() => {
            window.location.href = 'registro.php';
        }, 1500);
    }
    </script>
</body>
</html>
