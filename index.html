<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida - Biblioteca Sullivan</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logobiblioteca.png">
</head>
<body>
    <div id="pantalla-biblioteca">
        <div class="telon-portada" id="telon"></div>

        <div class="interfaz-bienvenida" id="bloque-entrada">
            <button id="btn-entrar" onclick="activarEfectoPortal()">
                INGRESAR AL SISTEMA
            </button>
        </div>
    </div>

    <script>
    function activarEfectoPortal() {
        const bloqueEntrada = document.getElementById('bloque-entrada');
        const telon = document.getElementById('telon');

        bloqueEntrada.classList.add('efecto-destello');

        setTimeout(() => {
            telon.classList.add('telon-abrir');
        }, 150);

        setTimeout(() => {
            window.location.href = 'login.php';
        }, 1050);
    }
    </script>
</body>
</html>
