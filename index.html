<body>

    <div class="portada-bienvenida">
        <div class="tarjeta-bienvenida">
            <h1>📚 Biblioteca Sullivan</h1>
            <p>Sistema de Información y Control de Préstamos</p>
            <a href="registro.php" class="btn-ingresar" onclick="entrarConSonido(event, this.href)">
                Ingresar al Sistema
            </a>
        </div>
    </div>

    <script>
    function entrarConSonido(evento, urlDestino) {
        evento.preventDefault();

        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
                const ctx = new AudioCtx();
                if (ctx.state === 'suspended') ctx.resume();

                const ahora = ctx.currentTime;
                // Acorde ascendente suave de bienvenida (Do5 -> Mi5 -> Sol5)
                const notas = [523.25, 659.25, 783.99];

                notas.forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const ganancia = ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, ahora + i * 0.08);

                    ganancia.gain.setValueAtTime(0.18, ahora + i * 0.08);
                    ganancia.gain.exponentialRampToValueAtTime(0.0001, ahora + i * 0.08 + 0.55);

                    osc.connect(ganancia);
                    ganancia.connect(ctx.destination);

                    osc.start(ahora + i * 0.08);
                    osc.stop(ahora + i * 0.08 + 0.55);
                });
            }
        } catch (e) {
            console.error(e);
        }

        // Espera 400ms para que el acorde termine de sonar antes de cambiar de página
        setTimeout(() => {
            window.location.href = urlDestino;
        }, 400);
    }
    </script>

</body>
</html>
