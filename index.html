<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrada al Sistema</title>
    <!-- Enlace a tus estilos CSS independientes -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="escenario" id="contenedorPuertas">
        
        <!-- Botón de acción con el ID para el evento -->
        <button class="boton-entrar" id="btnEntrar">ENTRAR AL SISTEMA</button>

        <!-- Hojas de las puertas -->
        <div class="puerta puerta-izquierda"></div>
        <div class="puerta puerta-derecha"></div>

        <!-- Pantalla de carga que se revela detrás -->
        <div class="fondo-sistema">
            <p>Cargando sistema...</p>
        </div>

    </div>

    <!-- Enlace a tu lógica JavaScript independiente -->
    <script src="script.js"></script>
</body>
</html>
