<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida - Biblioteca Sullivan</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logobiblioteca.png">
</head>
<body>

    <!-- Contenedor Maestro -->
    <div id="pantalla-biblioteca">
        
        <!-- Telón de fondo cinemático (Una sola capa, sin líneas divisorias) -->
        <div class="telon-portada"></div>

        <!-- Interfaz flotante con tu botón dorado institucional -->
        <div class="interfaz-bienvenida" id="bloque-entrada">
            <button id="btn-entrar" onclick="activarEfectoPortal()">Ingresar al Sistema</button>
        </div>

    </div>

    <script>
    function activarEfectoPortal() {
        const bloqueEntrada = document.getElementById('bloque-entrada');
        const telon = document.querySelector('.telon-portada');
        
        // 1. El botón se desvanece con un leve destello
        bloqueEntrada.classList.add('efecto-destello');
        
        // 2. Activamos el efecto cinemático de alejamiento y desvanecido en la portada
        setTimeout(() => {
            telon.classList.add('telon-abrir');
        }, 150);
        
        // 3. Redirección automática hacia tu archivo de registro PHP
        setTimeout(() => {
            window.location.href = 'registro.php';
        }, 1300);
    }
    </script>
</body>
</html>
