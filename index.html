<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida - Biblioteca Sullivan</title>
    <!-- Vinculación exclusiva a tu hoja de estilos externa -->
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logobiblioteca.png">
</head>
<body>

    <!-- Contenedor maestro de la animación digital -->
    <div id="pantalla-biblioteca">
        
        <!-- Interfaz flotante con tu botón institucional -->
        <div class="interfaz-bienvenida" id="bloque-entrada">
            <button id="btn-entrar" onclick="iniciarTransicionSistema()">Ingresar al Sistema</button>
        </div>

    </div>

    <!-- 🚀 MOTOR DE TRANSICIÓN JAVASCRIPT -->
    <script>
    function iniciarTransicionSistema() {
        const pantalla = document.getElementById('pantalla-biblioteca');
        const bloqueEntrada = document.getElementById('bloque-entrada');

        // Ocultamos el bloque usando la clase pura de tu CSS
        bloqueEntrada.classList.add('ocultar-boton');

        // Activamos el efecto de apertura digital en el fondo a los 200ms
        setTimeout(() => {
            pantalla.classList.add('efecto-abrir');
        }, 200);

        // Redirección segura a tu panel unificado
        setTimeout(() => {
            window.location.href = 'registro.php';
        }, 1000);
    }
    </script>
</body>
</html>
