<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida - Biblioteca Sullivan</title>
    <!-- Mantenemos la conexión limpia a tu hoja de estilos externa -->
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logobiblioteca.png">
</head>
<!-- Forzamos al body a ocupar toda la pantalla real del laboratorio -->
<body style="margin: 0 !important; padding: 0 !important; width: 100vw !important; height: 100vh !important; overflow: hidden !important; background-color: #1E293B !important;">

    <!-- 🚪 CONTENEDOR MAESTRO: Forzamos dimensiones y la primera foto (.JPG) en línea -->
    <div id="pantalla-biblioteca" class="fondo-cerrado" 
         style="width: 100vw !important; height: 100vh !important; background-image: url('puertas-cerradas.JPG') !important; background-size: cover !important; background-position: center !important; background-repeat: no-repeat !important; display: flex !important; justify-content: center !important; align-items: center !important; transition: background-image 0.2s ease-in-out !important;">
        
        <!-- Interfaz flotante del botón dorado de tus capturas -->
        <div class="interfaz-bienvenida" id="bloque-entrada" style="text-align: center !important;">
            <button id="btn-entrar" onclick="iniciarAnimacionPuertas()">Ingresar al Sistema</button>
        </div>

    </div>

    <!-- Zona técnica oculta de precarga para XAMPP -->
    <div style="display: none !important;">
        <img src="puertas-cerradas.JPG">
        <img src="puertas-semiabiertas.JPG">
        <img src="puertas-abiertas.JPG">
    </div>

    <!-- 🚀 MOTOR LOGICO JAVASCRIPT: Cambia los estilos en línea directamente -->
    <script>
    function iniciarAnimacionPuertas() {
        const pantalla = document.getElementById('pantalla-biblioteca');
        const bloqueEntrada = document.getElementById('bloque-entrada');

        // 1. Ocultamos el botón dorado
        bloqueEntrada.style.display = 'none';

        // 2. Paso 1: Cambiamos la imagen a semiabiertas a los 300ms
        setTimeout(() => {
            pantalla.style.backgroundImage = "url('puertas-semiabiertas.JPG')";
        }, 300);

        // 3. Paso 2: Cambiamos la imagen a abiertas a los 800ms
        setTimeout(() => {
            pantalla.style.backgroundImage = "url('puertas-abiertas.JPG')";
        }, 800);

        // 4. Redirección final segura al Panel Principal
        setTimeout(() => {
            window.location.href = 'registro.php';
        }, 1500);
    }
    </script>
</body>
</html>
