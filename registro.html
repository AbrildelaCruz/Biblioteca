    <!-- 🚀 JAVASCRIPT: Conecta el panel con la base de datos de manera interna -->
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        var contenedorAlertas = document.getElementById("panel-alertas");

        fetch("obtener_alertas.php")
            .then(response => response.json())
            .then(data => {
                contenedorAlertas.innerHTML = ""; 
                var tieneAlertasCriticas = false;

                if (data.length > 0) {
                    data.forEach(function(alerta) {
                        var claseTarjeta = "";
                        var mensajeTiempo = "";

                        if (alerta.dias < 0) {
                            claseTarjeta = "entrega-vencida";
                            mensajeTiempo = "⚠️ RETRASADO POR " + Math.abs(alerta.dias) + " DÍAS";
                            tieneAlertasCriticas = true;
                        } else if (alerta.dias === 0) {
                            claseTarjeta = "entrega-hoy";
                            mensajeTiempo = "⏳ ENTREGA HOY";
                            tieneAlertasCriticas = true;
                        } else if (alerta.dias <= 3) {
                            claseTarjeta = "entrega-proxima";
                            mensajeTiempo = "📅 Entrega en " + alerta.dias + " días";
                            tieneAlertasCriticas = true;
                        }

                        if (claseTarjeta !== "") {
                            var tarjeta = document.createElement("div");
                            tarjeta.className = "tarjeta-aviso " + claseTarjeta;
                            tarjeta.innerHTML = "<div><strong>" + mensajeTiempo + "</strong> — " +
                                                "<u>" + alerta.persona + "</u> debe devolver el libro " +
                                                "<b>\"" + alerta.libro + "\"</b> (Límite: " + alerta.fecha_limite + ")</div>";
                            contenedorAlertas.appendChild(tarjeta);
                        }
                    });
                }

                if (!tieneAlertasCriticas) {
                    contenedorAlertas.innerHTML = '<div class="aviso-vacio">🟢 No hay entregas críticas registradas para hoy ni para los siguientes días.</div>';
                }
            })
            .catch(error => {
                console.error("Error al cargar las alertas:", error);
                contenedorAlertas.innerHTML = '<div class="aviso-vacio" style="color: #991B1B;">❌ Hubo un problema al conectar con el servidor de notificaciones.</div>';
            });
    });
    </script>
