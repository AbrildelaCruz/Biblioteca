        <!-- COLUMNA DERECHA: EL PANEL DE NOTIFICACIONES LATERAL -->
        <div class="panel-notificaciones-derecho">

                <span class="campana-alerta">🔔</span> Entregas
            </h3>
            <!-- JavaScript inyectará las alertas aquí adentro automáticamente -->
            <div class="lista-alertas" id="panel-alertas">

            </div>
        </div>

    </div>

    <!-- 🚀 JAVASCRIPT: Conecta el panel con la base de datos de manera interna -->
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        var contenedorAlertas = document.getElementById("panel-alertas");

        fetch("obtener_alertas.php")
            .then(response => response.json())
            .then(data => {
                contenedorAlertas.innerHTML = ""; 
                var tieneAlertasCriticas = false;

                if (data.length > 0) {
                    data.forEach(function(alerta) {
                        var claseTarjeta = "";
                        var mensajeTiempo = "";

                        if (alerta.dias < 0) {
                            claseTarjeta = "entrega-vencida";
                            mensajeTiempo = "⚠️ RETRASADO";
                            tieneAlertasCriticas = true;
                        } else if (alerta.dias === 0) {
                            claseTarjeta = "entrega-hoy";
                            mensajeTiempo = "⏳ HOY";
                            tieneAlertasCriticas = true;
                        } else if (alerta.dias <= 3) {
                            claseTarjeta = "entrega-proxima";
                            mensajeTiempo = "📅 En " + alerta.dias + " días";
                            tieneAlertasCriticas = true;
                        }

                        if (claseTarjeta !== "") {
                            var tarjeta = document.createElement("div");
                            tarjeta.className = "tarjeta-aviso " + claseTarjeta;
                            tarjeta.innerHTML = "<div><strong>" + mensajeTiempo + "</strong><br>" +
                                                "<u>" + alerta.persona + "</u> tiene " +
                                                "<b>\"" + alerta.libro + "\"</b></div>";
                            contenedorAlertas.appendChild(tarjeta);
                        }
                    });
                }

                if (!tieneAlertasCriticas) {
                    contenedorAlertas.innerHTML = '<div class="aviso-vacio">🟢 Sin entregas críticas en los próximos días.</div>';
                }
            })
            .catch(error => {
                console.error("Error al cargar las alertas:", error);
                contenedorAlertas.innerHTML = '<div class="aviso-vacio" style="color: #991B1B;">❌ Error de conexión.</div>';
            });
    });

    </script>

      <a class="z2" href="index.html">REGRESAR</a>
  </div>
