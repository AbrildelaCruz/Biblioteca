    <style>
        /* FONDO GENERAL DEL SISTEMA */
        .body2 {
            background: linear-gradient(-45deg, #FFFFFF, #E8EEF5, #DDE6ED, #E8EEF5);
            background-size: 400% 400%;
            height: 100vh;
            width: 100vw;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-repeat: no-repeat;
            animation: cambiarFondo 15s ease infinite;
            position: relative;          
            overflow: hidden;             
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        @keyframes cambiarFondo {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ANIMACIÓN Y ESTILO DE LAS BURBUJAS DIGITALES */
        @keyframes flotar {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
            10% { opacity: 0.3; } 
            90% { opacity: 0.3; }
            100% { transform: translateY(-110vh) translateX(50px) scale(1.1); opacity: 0; }
        }

        .burbuja {
            position: absolute;
            bottom : -120px;
            background: rgba(15, 76, 129, 0.03); 
            border : 1px solid rgba(15, 76, 129, 0.08);
            border-radius : 50%;
            box-shadow : 0 0 12px rgba(232, 238, 245, 0.5), inset 0 0 8px rgba(255, 255, 255, 0.6);
            animation : flotar 16s linear infinite;
            z-index: 1;
        }

        /* Tiempos y posiciones de las burbujas */
        .burbuja:nth-child(1) { left: 10%; width: 80px; height: 80px; animation-duration: 18s; animation-delay: 0s; }
        .burbuja:nth-child(2) { left: 25%; width: 40px; height: 40px; animation-duration: 14s; animation-delay: 2s; }
        .burbuja:nth-child(3) { left: 40%; width: 120px; height: 120px; animation-duration: 22s; animation-delay: 4s; filter: blur(1px); } 
        .burbuja:nth-child(4) { left: 55%; width: 60px; height: 60px; animation-duration: 16s; animation-delay: 1s; }
        .burbuja:nth-child(5) { left: 70%; width: 90px; height: 90px; animation-duration: 20s; animation-delay: 5s; }
        .burbuja:nth-child(6) { left: 85%; width: 30px; height: 30px; animation-duration: 12s; animation-delay: 3s; }
        .burbuja:nth-child(7) { left: 50%; width: 50px; height: 50px; animation-duration: 17s; animation-delay: 7s; }
        .burbuja:nth-child(8) { left: 80%; width: 110px; height: 110px; animation-duration: 24s; animation-delay: 2s; filter: blur(1px); }

        /* CONTENEDOR CENTRAL (TARJETA) */
        .contenedorpadrere {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            width: 90%;
            max-width: 400px;
            margin: 0 auto;
            padding: 30px; 
            background-color: rgba(255, 255, 255, 0.92);

            font-weight: bold;
            color: #0F4C81; /* Azul Cobalto */
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* DISEÑO RECTANGULAR DE LOS BOTONES */
        .bton-1, .bton-2, .bton-3 {
            display: flex !important;         
            justify-content: center !important; 
            align-items: center !important;     
            width: 100% !important;             
            box-sizing: border-box !important;

            border: 1px solid #DDE6ED !important;
            font-size: 16px !important;
            font-weight: bold !important;
            cursor: pointer !important;
            border-radius: 8px !important; 
            text-align: center !important;

        }

        /* INTERACCIÓN (HOVER) */

            background-color: #0F4C81 !important; /* Azul Cobalto al pasar el mouse */
            color: #FFFFFF !important;            /* Texto Blanco */
            border-color: #0F4C81 !important;
            transform: translateY(-1px) !important;
        }

        .bton-1:active, .bton-2:active, .bton-3:active {
            background-color: #0B3459 !important; 
            transform: translateY(0) !important;
        }

            letter-spacing: 0.5px;
